<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证码查看 — 记账小程序</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f5f5; color:#333; padding:20px; }
h1 { font-size:20px; margin-bottom:16px; color:#1a1a1a; }
.status { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:#888; }
.dot { width:8px; height:8px; border-radius:50%; background:#4caf50; }
.dot.err { background:#f44336; }
.card { background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; align-items:center; gap:12px; }
.code { font-size:28px; font-weight:700; letter-spacing:4px; font-family:'SF Mono',Menlo,monospace; color:#1976d2; min-width:140px; }
.phone { font-size:15px; color:#555; }
.meta { margin-left:auto; font-size:12px; color:#999; text-align:right; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.badge-expired { background:#ffebee; color:#c62828; }
.badge-active { background:#e8f5e9; color:#2e7d32; }
.badge-locked { background:#fff3e0; color:#e65100; }
.empty { text-align:center; padding:60px 20px; color:#aaa; font-size:15px; }
</style>
</head>
<body>
<h1>📱 验证码查看</h1>
<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">连接中…</span>
</div>
<div id="list"></div>

<script>
const API = '/api/admin/verify-codes'
const dot = document.getElementById('dot')
const statusText = document.getElementById('statusText')
const list = document.getElementById('list')

let lastCount = -1

async function poll() {
  try {
    const resp = await fetch(API)
    const data = await resp.json()
    dot.className = 'dot'
    statusText.textContent = `已连接 · ${data.codes.length} 条验证码`

    if (data.codes.length !== lastCount) {
      lastCount = data.codes.length
      render(data.codes)
    }
  } catch (e) {
    dot.className = 'dot err'
    statusText.textContent = '连接失败，重试中…'
  }
}

function render(codes) {
  if (!codes.length) {
    list.innerHTML = '<div class="empty">暂无验证码<br><small>发送一条验证码后会自动出现</small></div>'
    return
  }
  list.innerHTML = codes.map(c => {
    let badge = ''
    if (c.locked) badge = '<span class="badge badge-locked">已锁定</span>'
    else if (c.expired) badge = '<span class="badge badge-expired">已过期</span>'
    else badge = '<span class="badge badge-active">有效</span>'
    return `<div class="card" style="opacity:${c.expired?0.5:1}">
      <div class="code">${c.code}</div>
      <div class="phone">${c.phone}</div>
      <div class="meta">
        ${badge}
        <div style="margin-top:4px">${c.failedAttempts||0} 次失败</div>
      </div>
    </div>`
  }).join('')
}

poll()
setInterval(poll, 3000)
</script>
</body>
</html>
